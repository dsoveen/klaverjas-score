<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Klaverjas live score Beheer</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Beheer: zelfde huisstijl als de app; overzicht bovenaan, daaronder de groepen */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
/* Layout: sticky scorebord bovenaan, invoerkaart, daaronder het scoreblok met rondes (nieuwste boven) */
:root {
  --bg: #edf1ec;
  --surface: #ffffff;
  --sunk: #e2e8e1;
  --fg: #16231c;
  --muted: #5c6b62;
  --line: #cfd8cf;
  --felt: #1d6a48;
  --felt-ink: #ffffff;
  --felt-soft: #d5e8dc;
  --red: #b8322f;
  --red-soft: #f6dcda;
  --gold: #9a6b00;
  --gold-soft: #f3e6c4;
  --s1: #2f6fb0; --s2: #c0573a; --s3: #7a5bb5; --s4: #1f8576; --av-ink: #ffffff;
  --f-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1712; --surface: #16231c; --sunk: #0a110d; --fg: #e6efe8; --muted: #93a49a;
    --line: #2a3a31; --felt: #3fa577; --felt-ink: #06140d; --felt-soft: #1c3a2b;
    --red: #ef7b74; --red-soft: #3a1d1c; --gold: #e3b54f; --gold-soft: #3a2f15;
    --s1: #79a9e0; --s2: #ec9273; --s3: #b39be6; --s4: #5cc4b1; --av-ink: #0b1410;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1712; --surface: #16231c; --sunk: #0a110d; --fg: #e6efe8; --muted: #93a49a;
  --line: #2a3a31; --felt: #3fa577; --felt-ink: #06140d; --felt-soft: #1c3a2b;
  --red: #ef7b74; --red-soft: #3a1d1c; --gold: #e3b54f; --gold-soft: #3a2f15;
    --s1: #79a9e0; --s2: #ec9273; --s3: #b39be6; --s4: #5cc4b1; --av-ink: #0b1410;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--felt); outline-offset: 2px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 700 30px/1 var(--f-num); margin: 0; letter-spacing: .01em; }
h1 small { font: 600 13px var(--f-body); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-left: 8px; }
.hright { display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.linkish { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
.btn { padding: 9px 14px; border-radius: 10px; font-weight: 700; font-size: 14px; }
.btn.primary { background: var(--felt); color: var(--felt-ink); }
.btn.ghost { background: var(--sunk); }
.btn.danger { background: var(--red); color: #fff; }
.btn.outline { border: 1px solid var(--red); color: var(--red); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.login { max-width: 380px; margin: 40px auto 0; display: flex; flex-direction: column; gap: 12px; }
.login h2 { font: 700 24px var(--f-num); margin: 0; }
.login p { margin: 0; color: var(--muted); line-height: 1.5; }
.txt { font: 500 16px var(--f-body); padding: 10px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--sunk); color: var(--fg); width: 100%; }
.bad { color: var(--red); }
.status { font-size: 13px; color: var(--muted); }
.status code { font-size: 12px; background: var(--sunk); padding: 2px 6px; border-radius: 5px; color: var(--fg); user-select: all; word-break: break-all; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kl { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.kv { font: 700 40px/1.05 var(--f-num); font-variant-numeric: tabular-nums; }
.ks { font-size: 13px; color: var(--muted); }
.chartcard h2, .tablecard h2 { font: 700 20px var(--f-num); margin: 0 0 8px; }
.chart { overflow-x: auto; }
.chart svg { display: block; width: 100%; max-width: 100%; height: auto; }
.chart text { font: 600 10.5px var(--f-body); fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart text.val { fill: var(--fg); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .bar { fill: var(--felt-soft); stroke: var(--felt); stroke-width: 1; }
.chart .bar.now { fill: var(--felt); }
.tablewrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
table { width: 100%; border-collapse: collapse; min-width: 640px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th[data-sort] { cursor: pointer; }
th:first-child { min-width: 170px; }
th[data-sort]::after { content: " ↕"; opacity: .35; }
th.on { color: var(--fg); }
th.on::after { content: " ↓"; opacity: 1; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; }
.grow { cursor: pointer; }
.grow:hover td, .grow.open td { background: var(--sunk); }
.sub { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.live { background: var(--felt-soft); color: var(--felt); }
.pill.done { background: var(--gold-soft); color: var(--gold); }
.pill.idle { background: var(--sunk); color: var(--muted); }
.detail td { background: var(--sunk); }
.det { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 4px 0 8px; }
.det p { margin: 4px 0 0; }
.det .wide { grid-column: 1 / -1; }
.det ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px 16px; }
.det li { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.det li span { color: var(--muted); }
.det .dz { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.det .row { display: flex; gap: 8px; }
.empty { color: var(--muted); text-align: center; padding: 20px; }
@media (max-width: 720px) { .det { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Klaverjas live score<small>Beheer</small></h1>
    <div class="hright"><span id="who"></span><button class="linkish" id="refresh">Vernieuwen</button><button class="linkish" id="logout">Uitloggen</button></div>
  </header>

  <section class="card login" id="loginView" hidden>
    <h2>Inloggen als beheerder</h2>
    <p>Met het beheeraccount uit Firebase (e-mail en wachtwoord). Dit staat los van de app: je groepen op deze telefoon blijven gewoon bestaan.</p>
    <form id="loginForm">
      <div style="display:flex;flex-direction:column;gap:8px">
        <input class="txt" id="mail" type="email" autocomplete="username" placeholder="E-mailadres" required aria-label="E-mailadres">
        <input class="txt" id="pass" type="password" autocomplete="current-password" placeholder="Wachtwoord" required aria-label="Wachtwoord">
        <button class="btn primary" id="loginBtn">Inloggen</button>
        <p class="bad" id="loginMsg" aria-live="polite"></p>
      </div>
    </form>
  </section>

  <div id="dashView" hidden>
    <p class="status" id="status" aria-live="polite"></p>
    <div id="dash" hidden style="display:flex;flex-direction:column;gap:16px">
      <section class="kpis" id="kpis" aria-label="Overzicht"></section>
      <section class="card chartcard"><h2>Gespeelde potjes per week</h2><div class="chart" id="chart"></div></section>
      <section class="card tablecard">
        <h2>Groepen</h2>
        <div class="tablewrap"><table>
          <thead><tr><th data-sort="name">Groep</th><th class="num" data-sort="members">Telefoons</th><th class="num" data-sort="games">Potjes</th><th>Nu</th><th data-sort="last">Laatst actief</th><th data-sort="created">Gemaakt</th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
      </section>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
